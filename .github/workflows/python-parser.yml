name: Python tree-sitter parser

on:
  pull_request:
    paths: ['parser-Python/**', '.github/workflows/python-parser.yml']
  push:
    branches: [main]
    paths: ['parser-Python/**', '.github/workflows/python-parser.yml']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: parser-Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parser-Python/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python -m pip install -r requirements.txt
      - run: npm test
        env:
          PYTHON_UAST_ORACLE: python
      - run: npm pack --dry-run
